name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Validate tag against Cargo version
        id: version
        run: |
          version=$(cargo xtask validate-release --tag "$GITHUB_REF_NAME")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate packaging
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm
          cargo test -p xtask
          cargo test -p xtask native_packages -- --ignored

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            target: x86_64-unknown-linux-gnu
          - platform: linux
            target: aarch64-unknown-linux-gnu
          - platform: linux
            target: armv7-unknown-linux-gnueabihf
          - platform: linux
            target: riscv64gc-unknown-linux-gnu
          - platform: linux
            target: x86_64-unknown-linux-musl
          - platform: linux
            target: aarch64-unknown-linux-musl
          - platform: android
            target: aarch64-linux-android
            abi: arm64-v8a
          - platform: android
            target: armv7-linux-androideabi
            abi: armeabi-v7a
          - platform: android
            target: x86_64-linux-android
            abi: x86_64
          - platform: android
            target: i686-linux-android
            abi: x86
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux cross-compilation toolchain
        if: matrix.platform == 'linux'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none
          package: ${{ matrix.platform == 'linux' && contains(matrix.target, '-gnu') && 'liblzma-dev' || '' }}
      - name: Install cargo-ndk
        if: matrix.platform == 'android'
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-ndk
      - name: Install native package tools
        if: matrix.platform == 'linux' && contains(matrix.target, '-gnu')
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Build and package debug and release
        run: |
          unset CARGO_BUILD_TARGET # Run xtask on the host, even with a cross toolchain.
          cargo xtask dist --target "${{ matrix.target }}"
          cargo xtask dist --target "${{ matrix.target }}" --release
      - name: Upload Android module binary
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-android-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/kurumi-containerd
          if-no-files-found: error
      - name: Upload debug and release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  with-tui:
    name: Build with TUI (${{ matrix.target }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
          - target: riscv64gc-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux cross-compilation toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none
          package: ${{ contains(matrix.target, '-gnu') && 'liblzma-dev' || '' }}
      - name: Install native package tools
        if: contains(matrix.target, '-gnu')
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release-with-tui-${{ matrix.target }}
      - name: Build and package debug and release with TUI
        run: |
          unset CARGO_BUILD_TARGET # Run xtask on the host.
          cargo xtask dist --target "${{ matrix.target }}" --with-tui
          cargo xtask dist --target "${{ matrix.target }}" --with-tui --release
      - name: Upload debug and release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}-with-tui
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [validate, build, with-tui, module]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: git-cliff
      - name: Generate changelog
        run: git-cliff --latest --strip header --output /tmp/changelog.md
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum -- *.deb *.rpm *.tar.xz *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.xz
            dist/*.zip
            dist/SHA256SUMS
          body_path: /tmp/changelog.md
          prerelease: ${{ contains(needs.validate.outputs.version, '-') }}
          fail_on_unmatched_files: true

  telegram:
    name: Notify Telegram release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Send Telegram release links
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        uses: Tools-cx-app/telegram-upload-bot@master
        with:
          bot-token: ${{ secrets.BOT_TOKEN }}
          chat-id: ${{ secrets.CHAT_ID }}
          tags: containerd
          is-release: "true"
          artifact-names: |
            kurumi-containerd-*
            SHA256SUMS

  module:
    name: Package Android module
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Android binaries
        uses: actions/download-artifact@v8
        with:
          pattern: kurumi-containerd-android-*
          path: artifacts
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Package Android module
        run: cargo xtask android-module --binaries artifacts --version-code "$GITHUB_RUN_NUMBER"
      - name: Upload module package
        uses: actions/upload-artifact@v7
        with:
          name: release-android-module
          path: dist/*.zip
          if-no-files-found: error
