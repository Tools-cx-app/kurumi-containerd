name: CI

on:
  push:
    branches: ["master"]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "android/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "android/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
          - abi: x86
            target: i686-linux-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-ndk

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
          cache-workspace-crates: "true"
          cache-all-crates: "true"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build debug and release
        run: |
          cargo ndk --platform 21 --target ${{ matrix.abi }} build --workspace --locked
          cargo ndk --platform 21 --target ${{ matrix.abi }} build --workspace --release --locked

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-android-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/kurumi-containerd
          if-no-files-found: error

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-android-${{ matrix.abi }}-debug
          path: target/${{ matrix.target }}/debug/kurumi-containerd
          if-no-files-found: error

  android-module:
    name: Android module
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download Android binaries
        uses: actions/download-artifact@v8
        with:
          pattern: kurumi-containerd-android-*
          path: artifacts
      - name: Package module
        run: |
          python3 .github/scripts/package-android-module.py \
            --binaries artifacts --output dist --version "$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')" \
            --version-code "$GITHUB_RUN_NUMBER"
      - name: Validate module scripts
        run: |
          sh -n android/module/customize.sh android/module/service.sh \
            android/module/bin/kurumi-containerd android/module/system/bin/kurumi-containerd
          python3 .github/scripts/test-android-module.py
      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-android-module
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
          - target: riscv64gc-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}
          cache-workspace-crates: "true"
          cache-all-crates: "true"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build debug and release
        run: |
          cargo build --workspace --locked --target ${{ matrix.target }}
          cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-linux-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kurumi-containerd
          if-no-files-found: error

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-linux-${{ matrix.target }}-debug
          path: target/${{ matrix.target }}/debug/kurumi-containerd
          if-no-files-found: error

  telegram:
    name: Package all artifacts and upload to Telegram
    runs-on: ubuntu-latest
    needs: [android, android-module, linux]
    if: github.event_name != 'pull_request'
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: kurumi-containerd-*
          path: artifacts
          merge-multiple: false

      - name: Package debug and release archives
        run: |
          mkdir -p dist
          cd artifacts
          for artifact in *; do
            suffix=
            if [[ "$artifact" == *-debug ]]; then
              suffix=-debug
            fi
            zip -r "../dist/kurumi-containerd-all-${GITHUB_SHA}${suffix}.zip" "$artifact"
          done

      - name: Upload combined artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-all
          path: dist/*.zip
          if-no-files-found: error


      - name: Upload release archive to Telegram
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        uses: Tools-cx-app/telegram-upload-bot@master
        with:
          bot-token: ${{ secrets.BOT_TOKEN }}
          chat-id: ${{ secrets.CHAT_ID }}
          files: ./dist/kurumi-containerd-all-${{ github.sha }}.zip

      - name: Upload debug archive to Telegram
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        uses: Tools-cx-app/telegram-upload-bot@master
        with:
          bot-token: ${{ secrets.BOT_TOKEN }}
          chat-id: ${{ secrets.CHAT_ID }}
          files: ./dist/kurumi-containerd-all-${{ github.sha }}-debug.zip
