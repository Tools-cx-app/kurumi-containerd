name: CI

on:
  push:
    branches: ["master"]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "xtask/**"
      - ".cargo/**"
      - "android/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "xtask/**"
      - ".cargo/**"
      - "android/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86_64
            target: x86_64-linux-android
          - abi: x86
            target: i686-linux-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2.87.28
        with:
          tool: cargo-ndk

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
          cache-workspace-crates: "true"
          cache-all-crates: "true"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build debug and release
        run: |
          unset CARGO_BUILD_TARGET # Run xtask on the host, even with a cross toolchain.
          cargo xtask build --target ${{ matrix.target }}
          cargo xtask build --target ${{ matrix.target }} --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-android-${{ matrix.abi }}
          path: target/${{ matrix.target }}/release/kurumi-containerd
          if-no-files-found: error

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-android-${{ matrix.abi }}-debug
          path: target/${{ matrix.target }}/debug/kurumi-containerd
          if-no-files-found: error

  android-module:
    name: Android module
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download Android binaries
        uses: actions/download-artifact@v8
        with:
          pattern: kurumi-containerd-android-*
          path: artifacts
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Package module
        run: cargo xtask android-module --binaries artifacts --version-code "$GITHUB_RUN_NUMBER"
      - name: Validate module scripts
        run: |
          sh -n android/module/customize.sh android/module/service.sh \
            android/module/bin/kurumi-containerd android/module/system/bin/kurumi-containerd
          cargo test -p xtask
      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-android-module
          path: dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
          - target: riscv64gc-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none
          package: ${{ contains(matrix.target, '-gnu') && 'liblzma-dev' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}
          cache-workspace-crates: "true"
          cache-all-crates: "true"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build debug and release
        run: |
          unset CARGO_BUILD_TARGET # Run xtask on the host, even with a cross toolchain.
          cargo xtask build --target ${{ matrix.target }}
          cargo xtask build --target ${{ matrix.target }} --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-linux-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/kurumi-containerd
          if-no-files-found: error

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-linux-${{ matrix.target }}-debug
          path: target/${{ matrix.target }}/debug/kurumi-containerd
          if-no-files-found: error

  with-tui:
    name: Linux with TUI (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
          - target: riscv64gc-unknown-linux-gnu
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross-compilation toolchain
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
          runner: none
          package: ${{ contains(matrix.target, '-gnu') && 'liblzma-dev' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-with-tui-${{ matrix.target }}
          cache-workspace-crates: "true"
          cache-all-crates: "true"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build debug and release with TUI
        run: |
          unset CARGO_BUILD_TARGET # Run xtask on the host.
          cargo xtask build --target ${{ matrix.target }} --with-tui
          cargo xtask build --target ${{ matrix.target }} --with-tui --release

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-linux-${{ matrix.target }}-with-tui
          path: target/${{ matrix.target }}/release/kurumi-containerd
          if-no-files-found: error

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: kurumi-containerd-linux-${{ matrix.target }}-with-tui-debug
          path: target/${{ matrix.target }}/debug/kurumi-containerd
          if-no-files-found: error

  artifacts:
    name: Package build artifacts
    runs-on: ubuntu-latest
    needs: [android, android-module, linux, with-tui]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      actions: read
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Send Telegram artifact links
        if: env.BOT_TOKEN != '' && env.CHAT_ID != ''
        uses: Tools-cx-app/telegram-upload-bot@master
        with:
          bot-token: ${{ secrets.BOT_TOKEN }}
          chat-id: ${{ secrets.CHAT_ID }}
          tags: containerd
          artifact-names: "kurumi-containerd-*"
