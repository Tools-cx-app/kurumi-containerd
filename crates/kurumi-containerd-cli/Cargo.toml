[package]
name = "kurumi-containerd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
servicectl = [
  "kurumi-containerd-config/servicectl",
  "kurumi-containerd-host/servicectl",
  "kurumi-containerd-runtime/servicectl",
  "kurumi-containerd-tui?/servicectl",
]
tui = ["dep:kurumi-containerd-tui"]

[dependencies]
kurumi-containerd-error = { workspace = true, features = ["runtime"] }
clap.workspace = true
kurumi-containerd-config = { path = "../kurumi-containerd-config" }
kurumi-containerd-daemon = { path = "../kurumi-containerd-daemon" }
kurumi-containerd-helper.workspace = true
kurumi-containerd-host = { path = "../kurumi-containerd-host" }
kurumi-containerd-runtime = { path = "../kurumi-containerd-runtime" }
kurumi-containerd-tui = { path = "../kurumi-containerd-tui", optional = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
