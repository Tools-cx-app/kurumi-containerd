[workspace]
members = [
  "crates/kurumi-containerd-cli",
  "crates/kurumi-containerd-config",
  "crates/kurumi-containerd-error",
  "crates/kurumi-containerd-host",
  "crates/kurumi-containerd-helper",
  "crates/kurumi-containerd-runtime",
  "crates/kurumi-containerd-tui",
]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.104"
bitflags = "2.13.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
fs2 = "0.4.3"
flate2 = { version = "1.1.11", default-features = false, features = [
  "rust_backend",
] }
kurumi-containerd-helper = { path = "crates/kurumi-containerd-helper" }
kurumi-containerd-error = { path = "crates/kurumi-containerd-error", default-features = false }
kurumi-containerd-host = { path = "crates/kurumi-containerd-host" }
libc = "0.2.191"
mio = { version = "1.2.4", features = ["os-poll", "os-ext"] }
procfs = { version = "0.18", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tar = "0.4.46"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.1", features = ["v4", "serde"] }
which = "8.0.6"
xz2 = "0.1.7"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
zstd = { version = "0.14.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
